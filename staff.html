<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2b"><title>Savannah Staff Dashboard</title>
<style>
:root{--g:#173b2b;--o:#f39a24;--bg:#fff8eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#26332a}header{background:var(--g);color:white;padding:18px;text-align:center}header b{color:var(--o);font-size:22px}main{max-width:1000px;margin:auto;padding:14px}.card{background:white;padding:15px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}input,select,textarea,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbb;margin:4px 0}input,textarea{width:100%}button{background:var(--g);color:white;border:0;font-weight:bold}button.secondary{background:#666}button.warn{background:#a54b16}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#68736b;font-size:13px}.order{border-top:1px solid #ddd;padding:12px 0}.pill{display:inline-block;background:#e8f1e9;padding:4px 8px;border-radius:20px;font-size:12px}h2,h3{color:var(--g)}#app{display:none}
</style></head><body><header><b>SAVANNAH FAST FOOD</b><div>Staff & Owner Dashboard</div></header><main>
<section id="login" class="card"><h2>Staff sign in</h2><p class="muted">Use the staff account invited by the Savannah owner.</p><input id="email" type="email" autocomplete="username" placeholder="Email address"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="row"><button id="signIn">SIGN IN</button><button class="secondary" id="reset">RESET PASSWORD</button></div><p id="loginMsg" role="status"></p></section>
<section id="app"><div class="card"><div class="row"><div><h2 id="welcome">Dashboard</h2><p id="role" class="muted"></p></div><button class="secondary" id="signOut">SIGN OUT</button></div><div class="row"><button id="refresh">REFRESH ORDERS</button><button id="storeToggle">STORE SWITCH</button></div><p id="storeState" class="pill">Checking store status…</p></div>
<div class="card"><h2>Incoming orders</h2><div id="orders">Loading…</div></div>
<div class="card" id="manager" style="display:none"><h2>Menu management</h2><div id="menuAdmin">Loading…</div><h2>Staff management</h2><input id="staffEmail" type="email" placeholder="New staff email"><input id="staffName" placeholder="Staff display name"><select id="staffRole"><option value="staff">Staff</option><option value="manager">Manager</option></select><button id="addStaff">ADD STAFF</button><div id="staffList"></div></div>
<p id="msg" role="status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://qgdlmpzgkcsldjufprhb.supabase.co","sb_publishable_v5BAHGeX9a-7k4slxRVyMQ_FyjVnfdx");
let profile=null,ordersEnabled=false,channel=null;
const $=id=>document.getElementById(id), say=t=>$("msg").textContent=t;
$("signIn").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginMsg").textContent=error?error.message:"Signed in. Checking staff access…";if(!error)await boot()};
$("reset").onclick=async()=>{const e=$("email").value.trim();if(!e)return $("loginMsg").textContent="Enter your email first.";const {error}=await db.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});$("loginMsg").textContent=error?error.message:"Password reset email requested."};
$("signOut").onclick=async()=>{await db.auth.signOut();location.reload()};
$("refresh").onclick=loadOrders;
$("storeToggle").onclick=async()=>{if(!profile||!["owner","manager"].includes(profile.staff_role))return;const {error}=await db.rpc("set_savannah_orders_enabled",{p_enabled:!ordersEnabled});if(error)say(error.message);else await loadStore()};
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data,error}=await db.rpc("get_my_savannah_staff_profile");if(error){say(error.message);return}profile=data?.[0];if(!profile||!profile.is_active){say("This account is not an active Savannah staff member.");await db.auth.signOut();return}$("login").style.display="none";$("app").style.display="block";$("welcome").textContent="Welcome, "+profile.display_name;$("role").textContent="Role: "+profile.staff_role;if(["owner","manager"].includes(profile.staff_role))$("manager").style.display="block";await loadStore();await loadOrders();if(channel)db.removeChannel(channel);channel=db.channel("savannah-orders").on("postgres_changes",{event:"*",schema:"public",table:"orders"},loadOrders).subscribe();if(["owner","manager"].includes(profile.staff_role)){await loadMenu();await loadStaff()}}
async function loadStore(){const {data,error}=await db.rpc("get_savannah_store_settings");if(error)return say(error.message);ordersEnabled=!!data?.[0]?.orders_enabled;$("storeState").textContent=ordersEnabled?"Customer ordering ENABLED":"Customer ordering DISABLED";$("storeToggle").textContent=ordersEnabled?"CLOSE CUSTOMER ORDERS":"OPEN CUSTOMER ORDERS"}
async function loadOrders(){const {data,error}=await db.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);if(error){$("orders").textContent=error.message;return}if(!data?.length){$("orders").textContent="No orders yet.";return}$("orders").innerHTML=data.map(o=>{const items=(o.order_items||[]).map(i=>(i.combo_name||i.item_name||"Combo")+" × "+i.quantity).join("<br>");const statuses=["received","confirmed","preparing","ready","out_for_delivery","delivered","rejected","cancelled"];return '<div class="order"><b>Order '+o.id+'</b> <span class="pill">'+o.status+'</span><p>'+esc(o.customer_name)+' · '+esc(o.customer_phone)+'<br>'+esc(o.delivery_location||"")+'</p><p>'+items+'</p><b>KSh '+Number(o.total_kes||o.total_amount_kes||0).toLocaleString("en-KE")+'</b><p class="muted">Payment: '+esc(o.payment_status||"pay_after_delivery")+' · '+new Date(o.created_at).toLocaleString()+'</p><div class="row"><select id="s-'+o.id+'">'+statuses.map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join("")+'</select><button onclick="updateStatus(\''+o.id+'\')">UPDATE</button></div><input id="n-'+o.id+'" placeholder="Note / rejection reason (required for rejection)"><button class="secondary" onclick="claim(\''+o.id+'\')">CLAIM ORDER</button>'+(o.status==="delivered"&&o.payment_status!=="paid"?'<button onclick="markPaid(\''+o.id+'\')">MARK PAID</button>':'')+'</div>'}).join("")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.updateStatus=async id=>{const {error}=await db.rpc("update_savannah_order_status",{p_order_id:id,p_status:$("s-"+id).value,p_note:$("n-"+id).value||null});say(error?error.message:"Order status updated.");if(!error)loadOrders()};
window.claim=async id=>{const {error}=await db.rpc("claim_savannah_order",{p_order_id:id});say(error?error.message:"Order claimed.");if(!error)loadOrders()};
window.markPaid=async id=>{if(!confirm("Confirm payment has actually been received after delivery?"))return;const {error}=await db.rpc("mark_savannah_order_paid",{p_order_id:id});say(error?error.message:"Payment marked as received.");if(!error)loadOrders()};
async function loadMenu(){const {data,error}=await db.rpc("get_savannah_admin_menu");if(error){$("menuAdmin").textContent=error.message;return}$("menuAdmin").innerHTML=(data||[]).map(c=>'<div class="order"><b>'+esc(c.combo_name)+'</b><div class="row"><input type="number" id="p-'+c.combo_id+'" value="'+c.price_kes+'"><label><input type="checkbox" id="a-'+c.combo_id+'" '+(c.is_active?'checked':'')+'> Active</label><label><input type="checkbox" id="r-'+c.combo_id+'" '+(c.price_reviewed?'checked':'')+'> Price approved</label><button onclick="saveCombo(\''+c.combo_id+'\')">SAVE</button></div></div>').join("")}
window.saveCombo=async id=>{const price=Number($("p-"+id).value);if(!Number.isInteger(price)||price<1)return say("Enter a valid whole-number price.");const {error}=await db.rpc("set_savannah_combo",{p_combo_id:id,p_price_kes:price,p_is_active:$("a-"+id).checked,p_price_reviewed:$("r-"+id).checked});say(error?error.message:"Combo saved.");if(!error)loadMenu()};
async function loadStaff(){const {data,error}=await db.rpc("list_savannah_staff");if(error){$("staffList").textContent=error.message;return}$("staffList").innerHTML=(data||[]).map(s=>'<div class="order">'+esc(s.display_name)+' · '+esc(s.email)+' · '+esc(s.staff_role)+' · '+(s.is_active?'Active':'Inactive')+' <button class="secondary" onclick="toggleStaff(\''+s.user_id+'\','+(!s.is_active)+')">'+(s.is_active?'DEACTIVATE':'REACTIVATE')+'</button></div>').join("")}
$("addStaff").onclick=async()=>{const {error}=await db.rpc("add_savannah_staff",{p_email:$("staffEmail").value.trim(),p_display_name:$("staffName").value.trim(),p_staff_role:$("staffRole").value});say(error?error.message:"Staff invitation/access record added. Ensure the user signs up with that email.");if(!error)loadStaff()};
window.toggleStaff=async(id,active)=>{const {error}=await db.rpc("set_savannah_staff_active",{p_user_id:id,p_is_active:active});say(error?error.message:"Staff access updated.");if(!error)loadStaff()};
db.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
